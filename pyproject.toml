[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-data-analysis-agent"
version = "1.0.0"
description = "DataWizard: AI data analysis agent built with LangChain 1.x tool calling — ask about CSV files in plain English; it lists, summarizes and inspects data, detects classification vs regression and trains scikit-learn models. Gemini (free), OpenAI or offline mode. 82 tests, 98% coverage."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "VictorV" }]
keywords = ["langchain", "langgraph", "ai-agents", "tool-calling", "agentic-ai", "llm", "data-analysis", "data-science", "pandas", "scikit-learn", "gemini", "openai", "python", "pytest", "coursera", "portfolio-project"]
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=3.0"]
openai = ["langchain-openai>=1.0"]
classic = ["langchain-classic>=1.0"]
dev = ["pytest>=8", "pytest-cov>=5", "nbclient>=0.10", "nbformat>=5.10", "ipykernel>=6"]
all = ["langchain-data-analysis-agent[gemini,openai,classic,dev]"]

[project.scripts]
data-agent = "data_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["live: calls a real LLM API (needs GOOGLE_API_KEY or OPENAI_API_KEY); skipped otherwise"]
